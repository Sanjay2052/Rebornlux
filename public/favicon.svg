<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Hexagon -->
  <path d="M 50,5 L 89,27.5 L 89,72.5 L 50,95 L 11,72.5 L 11,27.5 Z" fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#glow)" opacity="0.6" />
  
  <!-- Outer Hexagon Border -->
  <path d="M 50,8 L 86,29 L 86,71 L 50,92 L 14,71 L 14,29 Z" fill="none" stroke="url(#lexGrad)" stroke-width="2" />
  
  <!-- Stylized R + L Shape -->
  <!-- R-loop starting from center column -->
  <path d="M 38,30 L 58,30 C 66,30 68,36 68,40 C 68,44 64,48 56,48 L 38,48 Z" fill="url(#lexGrad)" />
  <!-- R-leg & L-base -->
  <path d="M 38,30 L 46,30 L 46,70 L 66,70 L 66,76 L 38,76 Z" fill="url(#lexGrad)" />
  <!-- R-diagonal leg -->
  <path d="M 50,48 L 64,72 L 54,72 L 42,50 Z" fill="url(#lexGrad)" />
  
  <!-- Center Core Glow Dot -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>